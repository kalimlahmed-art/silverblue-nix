---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: silverblue-nix
description: Fedora Silverblue 44 with Determinate Nix bootstrap support.

base-image: ghcr.io/ublue-os/silverblue-main
# Keep this pinned to the intended Fedora major version.
image-version: 44

modules:
  # Create /nix in the ostree commit so the Determinate installer has a real
  # mountpoint on an otherwise immutable root. Do not ship nix.mount or
  # nix-directory.service here: Determinate's installer owns those units.
  - type: script
    scripts:
      - prepare-nix.sh

  # RPM Fusion repos are enabled but nothing is installed from them here — they
  # exist so per-host `rpm-ostree install` (codecs, OBS, etc.) just works.
  # If image-version above bumps to a new Fedora major, bump the -44 in the
  # RPM Fusion URLs to match.
  # Must run before the systemd module so tailscaled.service exists when enabled.
  - type: rpm-ostree
    repos:
      - https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
      - https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-44.noarch.rpm
      - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      - https://repository.mullvad.net/rpm/stable/mullvad.repo
    install:
      - tailscale
      - mullvad-vpn

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  # Sets up the cosign policy/key files used by signed registry images.
  - type: signing
